info:
  name: 1. Request OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Sends a 6-digit OTP to the given email. Check inbox — response is generic regardless of whether the email exists.
