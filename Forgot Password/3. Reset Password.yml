info:
  name: 3. Reset Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "resetToken": "{{resetToken}}",
        "newPassword": "NewPass123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Uses the resetToken from step 2 to set a new password. All existing sessions are invalidated on success.
