info:
  name: 2. Resend OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/resend-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Issues a fresh OTP and invalidates the previous one. Use if the first OTP expired or wasn't received.
