info:
  name: Create Schedule
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/schedules"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "date": "2026-09-01T09:00:00.000Z",
        "instructor": "{{instructorId}}",
        "slotsAvailable": 10,
        "amount": 3500,
        "remarks": "Morning session"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 201', function () { expect(res.getStatus()).to.equal(201); });
        const jsonData = res.getBody();
        if (jsonData.schedule && jsonData.schedule._id) { bru.setEnvVar('scheduleId', jsonData.schedule._id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin-only. instructor must reference a real instructor's _id (uses {{instructorId}} auto-saved from the Instructors folder). Auto-saves the created schedule's _id to {{scheduleId}}.
