info:
  name: Create Schedule (No Token)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/schedules"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "date": "2026-09-01T09:00:00.000Z",
        "instructor": "{{instructorId}}",
        "slotsAvailable": 10,
        "amount": 3500
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Should return 401 — no token provided.
