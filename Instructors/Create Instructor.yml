info:
  name: Create Instructor
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/instructors"
  body:
    type: multipart-form
    data:
      - name: firstName
        type: text
        value: Juan
      - name: middleName
        type: text
        value: Dela
      - name: lastName
        type: text
        value: Cruz
      - name: gender
        type: text
        value: Male
      - name: birthdate
        type: text
        value: 1990-03-20
      - name: address
        type: text
        value: Piassa, Addis Ababa
      - name: contact
        type: text
        value: "0922334455"
      - name: email
        type: text
        value: juan.delacruz@example.com
      - name: username
        type: text
        value: juandelacruz
      - name: password
        type: text
        value: instructor123
      - name: drivingExperience
        type: text
        value: 8 years, licensed driving instructor since 2016
      - name: profilePicture
        type: file
        value: []
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 201', function () { expect(res.getStatus()).to.equal(201); });
        const jsonData = res.getBody();
        if (jsonData.instructor && jsonData.instructor._id) { bru.setEnvVar('instructorId', jsonData.instructor._id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin-only. Body is form-data to support the optional profilePicture file (JPEG/PNG/WEBP, max 2MB). Auto-saves the created instructor's _id to {{instructorId}}.
