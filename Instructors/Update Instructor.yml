info:
  name: Update Instructor
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/instructors/{{instructorId}}"
  body:
    type: multipart-form
    data:
      - name: contact
        type: text
        value: "0933445566"
      - name: address
        type: text
        value: Kirkos, Addis Ababa
      - name: drivingExperience
        type: text
        value: 9 years, licensed instructor
      - name: profilePicture
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: profilePicture is optional here — only include it to replace the existing picture (old file is deleted from disk on success).
