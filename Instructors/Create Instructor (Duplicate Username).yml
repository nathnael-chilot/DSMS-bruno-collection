info:
  name: Create Instructor (Duplicate Username)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/instructors"
  body:
    type: multipart-form
    data:
      - name: firstName
        type: text
        value: Juan
      - name: lastName
        type: text
        value: Cruz2
      - name: gender
        type: text
        value: Male
      - name: email
        type: text
        value: juan.cruz2@example.com
      - name: username
        type: text
        value: juandelacruz
      - name: password
        type: text
        value: instructor123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Should return 409 — username already in use.
