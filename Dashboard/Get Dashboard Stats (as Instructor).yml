info:
  name: Get Dashboard Stats (as Instructor)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/dashboard"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Run while logged in as instructor. Returns scheduleCount (own schedules) and studentCount (distinct students enrolled with them).
