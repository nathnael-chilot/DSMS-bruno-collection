info:
  name: Change My Password (Wrong Current Password)
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/profile/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "DefinitelyWrongPassword",
        "newPassword": "NewPass123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Should return 401 — Current password is incorrect.
