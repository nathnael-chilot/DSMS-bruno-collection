info:
  name: Change My Password
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/profile/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{adminPassword}}",
        "newPassword": "NewPass123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Requires the current password. On success, invalidates the stored refresh token — you'll need to log in again. Update {{adminPassword}} afterward if you run this against the admin account.
