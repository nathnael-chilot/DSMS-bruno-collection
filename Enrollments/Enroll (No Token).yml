info:
  name: Enroll (No Token)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/enrollments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "scheduleId": "{{scheduleId}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Should return 401 — no token provided.
