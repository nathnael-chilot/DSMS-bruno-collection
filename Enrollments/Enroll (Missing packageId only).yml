http:
  method: POST
  url: "{{baseUrl}}/api/enrollments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "scheduleId": "{{scheduleId}}",
        "remarks": "Missing packageId"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

