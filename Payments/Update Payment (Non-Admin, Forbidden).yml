info:
  name: Update Payment (Non-Admin, Forbidden)
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/payments/{{paymentId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "paid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Run while logged in as a student — should return 403. Students cannot self-verify their own payment.
