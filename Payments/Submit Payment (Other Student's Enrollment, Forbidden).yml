info:
  name: Submit Payment (Other Student's Enrollment, Forbidden)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/payments"
  body:
    type: multipart-form
    data:
      - name: enrollmentId
        type: text
        value: "{{enrollmentId}}"
      - name: amount
        type: text
        value: "3500"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Run while logged in as a DIFFERENT student (not the enrollment's owner) — should return 403.
