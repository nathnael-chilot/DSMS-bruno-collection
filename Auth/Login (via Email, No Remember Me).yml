info:
  name: Login (via Email, No Remember Me)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: rememberMe omitted — defaults to the short 1-day refresh token session.
