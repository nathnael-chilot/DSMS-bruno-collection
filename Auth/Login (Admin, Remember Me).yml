info:
  name: Login (Admin, Remember Me)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "{{adminUsername}}",
        "password": "{{adminPassword}}",
        "rememberMe": true
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 200', function () { expect(res.getStatus()).to.equal(200); });
        const jsonData = res.getBody();
        if (jsonData.accessToken) { bru.setEnvVar('token', jsonData.accessToken); }
        if (jsonData.refreshToken) { bru.setEnvVar('refreshToken', jsonData.refreshToken); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "identifier accepts username OR email. rememberMe: true issues a 30-day refresh token instead of the default 1-day one. Auto-saves accessToken and refreshToken."
