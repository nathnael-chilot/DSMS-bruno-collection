info:
  name: Create Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/students"
  body:
    type: multipart-form
    data:
      - name: firstName
        type: text
        value: Jane
      - name: middleName
        type: text
        value: A
      - name: lastName
        type: text
        value: Doe
      - name: gender
        type: text
        value: Female
      - name: birthdate
        type: text
        value: 2000-05-14
      - name: address
        type: text
        value: Bole, Addis Ababa
      - name: contact
        type: text
        value: "0911223344"
      - name: email
        type: text
        value: jane@example.com
      - name: username
        type: text
        value: jane
      - name: password
        type: text
        value: student123
      - name: profilePicture
        type: file
        value: []
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 201', function () { expect(res.getStatus()).to.equal(201); });
        const jsonData = res.getBody();
        if (jsonData.student && jsonData.student._id) { bru.setEnvVar('studentId', jsonData.student._id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin-only. Body is form-data to support the optional profilePicture file (JPEG/PNG/WEBP, max 2MB). Auto-saves the created student's _id to {{studentId}}.
