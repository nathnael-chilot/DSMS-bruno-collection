info:
  name: Update Package
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/packages/{{packageId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "price": 22000,
        "description": "Updated basic driving training package"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin-only.
