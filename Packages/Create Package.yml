info:
  name: Create Package
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/packages"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Package 1",
        "description": "Basic driving training package",
        "price": 20000
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 201', function () { expect(res.getStatus()).to.equal(201); });
        const jsonData = res.getBody();
        if (jsonData.package && jsonData.package._id) { bru.setEnvVar('packageId', jsonData.package._id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin-only. Auto-saves the created package's _id to {{packageId}}.
